name: Deployment

# Every push deploys: main becomes the live site, other branches get a
# preview URL. `--branch` below tells Cloudflare which is which.
on:
  push:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pages project name. Must match the dashboard exactly.
  # The dashboard shows this project as "zz2" with domains
  #   zz2.xswt.fyi + zz2-e2m.pages.dev
  # The bare "zz2.pages.dev" is NOT ours — Cloudflare assigns the -e2m
  # suffix and the short form belongs to someone else. Verify against the
  # custom domain, which is the address OBS actually uses.
  PAGES_PROJECT: zz2
  PAGES_URL: https://zz2.xswt.fyi

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate the site is actually servable
        run: |
          set -euo pipefail
          # The site lives in bg/ — that directory IS the Pages output root.
          # A static upload is the whole build step, but a typo in index.html
          # would otherwise ship a blank page with no signal.
          SITE=bg
          test -d "$SITE"        || { echo "::error::bg/ missing — is the site in the right directory?"; exit 1; }
          test -f "$SITE/index.html" || { echo "::error::bg/index.html missing"; exit 1; }
          test -f "$SITE/styles.css" || { echo "::error::bg/styles.css missing"; exit 1; }
          test -f "$SITE/script.js"  || { echo "::error::bg/script.js missing";  exit 1; }
          test -f "$SITE/config.js"  || { echo "::error::bg/config.js missing";  exit 1; }
          # Without _headers, Pages serves CSS/JS with max-age=14400 and a
          # browser keeps the old page for hours after a deploy. It fails
          # silently, so assert it is present.
          test -f "$SITE/_headers"   || { echo "::error::bg/_headers missing — assets will be cached for 4h and edits will appear stale"; exit 1; }

          # Every referenced asset must exist, or OBS shows a bare page.
          cd "$SITE"
          for f in $(grep -oE '(href|src)="[^"]+"' index.html \
                     | sed -E 's/.*="([^"]+)"/\1/' | grep -v '^https\?:'); do
            test -e "$f" || { echo "::error::index.html references missing file: $f"; exit 1; }
          done
          echo "All referenced assets present in $SITE/"

      - name: Parse JS (fail fast on syntax errors)
        run: node --check bg/config.js && node --check bg/script.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # main -> the live site; anything else -> a preview URL.
          # Hardcoding --branch=main here would let a dev branch overwrite
          # production, so the ref is read from the checkout instead.
          command: pages deploy bg --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Verify the deployment answers
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # main is verified on the custom domain — the address OBS actually
          # uses, and the only one that is not a throwaway deployment URL.
          #
          # For previews we read the URL wrangler printed rather than
          # constructing it: Cloudflare's hostname suffix is assigned, not
          # derived from the project name, so a guessed pattern is wrong.
          if [ "$BRANCH" = "main" ]; then
            url="$PAGES_URL"
            echo "Verifying $url"
          else
            url=""
            echo "Preview deploy — using the deployment URL from wrangler output."
          fi

          ok=0
          if [ -n "$url" ]; then
            for i in $(seq 1 10); do
              # -L matters: any redirect must be followed before judging.
              code=$(curl -sL -o /dev/null -w '%{http_code}' "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "Live at $url"
                ok=1
                break
              fi
              echo "attempt $i: HTTP $code — retrying"
              sleep 6
            done
          else
            ok=1   # nothing stable to poll; the deploy step already succeeded
          fi

          # Confirm the page is really ours, not a parked or unrelated domain.
          if [ "$ok" = "1" ] && [ -n "$url" ]; then
            if curl -sL "$url" | grep -q "HUMAN LIMIT FACILITY"; then
              echo "Content check passed."
            else
              echo "::error::$url answered 200 but is not this site — check the custom domain binding"
              exit 1
            fi
          fi

          if [ "$ok" = "0" ] && [ "$BRANCH" = "main" ]; then
            echo "::error::production did not answer 200 within 60s; check the Pages dashboard"
            exit 1
          fi
          if [ "$ok" = "0" ]; then
            echo "::warning::preview did not answer 200 within 60s"
          fi

      - name: Summary
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "### Deployment"
            echo ""
            if [ "$BRANCH" = "main" ]; then
              echo "Production deploy of \`$BRANCH\` — this is the live OBS source."
            else
              echo "Preview deploy of \`$BRANCH\` — production is untouched."
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Project | \`$PAGES_PROJECT\` |"
            echo "| OBS source | $PAGES_URL |"
            echo "| Resolution | 1920 x 1080 |"
            echo "| Live params | \`?intensity=0.6\` |"
          } >> "$GITHUB_STEP_SUMMARY"